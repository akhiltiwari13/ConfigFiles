# Cap AUR / makepkg build parallelism on this 16 GiB laptop.
#
# Stock /etc/makepkg.conf ships MAKEFLAGS commented out. That leaves autotools
# packages serial, but any cmake/ninja/meson/cargo PKGBUILD detects nproc and
# builds on all 22 cores — and OPTIONS=(... lto) with LTOFLAGS="-flto=auto" links
# on all cores too. Relevant during `omarchy-update`, which rebuilds AUR packages.
#
# A drop-in rather than editing /etc/makepkg.conf directly, so pacman upgrades
# don't produce a .pacnew conflict. Verified: libmakepkg/util/config.sh sources
# /etc/makepkg.conf.d/*.conf after the main file.
#
# See syshardening/PLAN.md Phase 2c.
MAKEFLAGS="-j6"
