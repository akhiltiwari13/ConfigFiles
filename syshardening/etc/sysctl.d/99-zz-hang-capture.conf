# Hang capture + rescue — omarchy-tp
#
# WHY: every system freeze on this machine so far has left zero evidence. journald
# cannot flush during the wedge, so all abrupt boots end mid-line with no error.
# These settings turn a silent 40-minute freeze into either a recoverable event or
# a logged panic with a stack trace.
#
# See syshardening/PLAN.md Part 1 (root cause) and Phase 0c.
# Sorts after Omarchy's 99-omarchy-sysctl.conf, so these values win.

# Enable ALL magic-SysRq functions. Default here was 16 (sync only), which leaves
# the OOM-kill (+f, bit 64) and reboot (+b, bit 128) functions DISABLED — i.e.
# REISUB could not rescue a freeze. The internal keyboard is PS/2 (isa0060/serio0)
# and carries the sysrq handler, so this works even if the USB stack is wedged.
#   Alt+SysRq+h   help (proves the kernel is alive)
#   Alt+SysRq+f   OOM-kill the largest task
#   R E I S U B   clean reboot without the power button
kernel.sysrq = 1

# Report tasks blocked in uninterruptible sleep for more than 60s.
kernel.hung_task_timeout_secs = 60

# ...and panic on one, so pstore captures a stack trace instead of silence.
#
# TRADEOFF, read before enabling: this converts a long freeze into a fast
# automatic reboot. Unsaved work is lost sooner — but it is lost anyway today,
# and currently you learn nothing. REVERT THIS once a trace has been captured.
kernel.hung_task_panic = 1
kernel.panic_on_oops = 1

# Auto-reboot 20s after a panic (gives pstore time to write).
kernel.panic = 20
