# Critical-battery policy — omarchy-tp
#
# WHY: 8 of the 9 abrupt shutdowns in the retained journal were preceded by
#   "suspend requested from client PID N ('upowerd')"
# i.e. UPower's critical-battery action. The contingency table over 18 boots:
#
#                          ended abruptly   clean shutdown
#   used s2idle suspend           9               1
#   never suspended               0               8
#
# Boot -3 ran 2.7 days without suspending and shut down cleanly. Not one boot
# that never suspended ever died.
#
# Stock config was PercentageAction=2.0 with CriticalPowerAction=Auto. "Auto"
# resolves to Hibernate ONLY if hibernation is configured; it was not, so it
# degraded to Suspend — into s2idle, which on Meteor Lake keeps drawing power.
# At 2% of a 44.1 Wh battery there is ~0.9 Wh (~2-4 min) of margin, which is not
# enough to write a hibernation image either.
#
# Act earlier so hibernate has time to complete. Requires the hibernation
# swapfile from PLAN.md Phase 1a (omarchy-hibernation-setup) for CriticalPowerAction=Auto
# to actually resolve to Hibernate — verify with `omarchy-hibernation-available`.
#
# See syshardening/PLAN.md Part 1 (rev 4/5) and Phase 1a.

[UPower]
PercentageLow=25.0
PercentageCritical=10.0
PercentageAction=5.0
