# Core configuration (type 'conan config list' to list possible values)
# e.g, for CI systems, to raise if user input would block
# core:non_interactive = True
# some tools.xxx config also possible, though generally better in profiles
# tools.android:ndk_path = my/path/to/android/ndk

# Cap Conan's build parallelism on this 16 GiB laptop.
#
# Without this, the Conan-generated CMakePresets.json carries "jobs": 22 for both
# build and test presets, and `conan install --build=missing` compiles boost /
# folly / abseil from source on all 22 cores — the single heaviest memory
# scenario on this machine. MAKEFLAGS/CMAKE_BUILD_PARALLEL_LEVEL do not reach it.
#
# See syshardening/PLAN.md Phase 2b.
tools.build:jobs=6
