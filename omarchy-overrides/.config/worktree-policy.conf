# Worktree location policy — allowlist of paths exempt from the ~/Work/worktrees rule.
# One shell glob per line, matched against BOTH the requested worktree path and the
# repo's primary worktree path. Read by ~/.config/bin/git and ~/.config/bin/wt-audit.

# quant-research: pinned, NOT a preference. docker-compose.yml mounts ./pqr and
# ./platform, and these worktrees are nested inside those mounts -- that is the only
# reason they reach the container. pqr/platform is also a root-owned symlink to the
# container-absolute /quant-research/platform/research00. Moving them breaks the build.
~/Work/learn/quant-research/*

# Claude Code's own EnterWorktree creates session-scoped worktrees inside the repo
# and removes them on exit. Ephemeral tool state, not a lane -- exempt rather than
# break a built-in feature.
*/.claude/worktrees/*
